name: Setup Blowfish Config

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Download Blowfish config (v2.100.0)
        run: |
          wget https://github.com/nunocoracao/blowfish/releases/download/v2.100.0/config-default.zip -O config-default.zip

      - name: Extract config into temp folder
        run: |
          mkdir -p tmp-config
          unzip config-default.zip -d tmp-config

      - name: Move config into Hugo project
        run: |
          mkdir -p config
          rm -rf config/_default
          mv tmp-config/config/_default config/_default

      - name: Cleanup archive
        run: rm config-default.zip

      - name: Commit config files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add config/_default
          git commit -m "Add Blowfish v2.100.0 default config" || echo "No changes to commit"
          git push
