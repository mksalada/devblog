name: Setup Hugo + Blowfish

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Hugo Extended 0.155.3
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.155.3'
          extended: true

      - name: Verify Hugo installation
        run: hugo version

      - name: Initialize Hugo site (if empty)
        run: |
          if [ ! -f "hugo.toml" ] && [ ! -f "config.toml" ] && [ ! -f "config.yaml" ]; then
            hugo new site . --force
          fi

      - name: Add Blowfish theme as submodule (v2.100.0)
        run: |
          git submodule add https://github.com/nunocoracao/blowfish.git themes/blowfish
          cd themes/blowfish
          git fetch --tags
          git checkout v2.100.0
          cd ../..

      - name: Commit initial Hugo setup
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Initial Hugo setup with Blowfish v2.100.0" || echo "No changes to commit"
          git push
